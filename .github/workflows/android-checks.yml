name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0' 'platform-tools'
      - name: Compile, test, lint, and build debug APK
        run: bash ./gradlew --no-daemon --max-workers=2 :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Save debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FortressTV-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # The same R8 configuration as the release (the benchmark build type copies it), signed with
      # the debug key because pull requests have no keystore. Install this one to test a change
      # the way users will get it: R8 problems do not show up in the debug APK.
      - name: Build minified (R8) benchmark APK
        run: bash ./gradlew --no-daemon --max-workers=2 :app:assembleBenchmark
      - name: Save minified (R8) benchmark APK and its mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FortressTV-minified-R8-benchmark-${{ github.run_number }}
          path: |
            app/build/outputs/apk/benchmark/app-benchmark.apk
            app/build/outputs/mapping/benchmark/mapping.txt
          if-no-files-found: error
          retention-days: 14
